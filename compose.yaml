services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "9010:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9010
      # The existing .env database is configured for the Windows host.
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
